name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/CctvCoverage.Core.Tests/CctvCoverage.Core.Tests.csproj --configuration Release

  revit-addin-build:
    # Compile-only: Revit itself is not available in CI.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build src/CctvCoverage.Revit/CctvCoverage.Revit.csproj --configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: CctvCoverage-Revit2026
          path: |
            src/CctvCoverage.Revit/bin/Release/net8.0-windows/CctvCoverage.Revit.dll
            src/CctvCoverage.Revit/bin/Release/net8.0-windows/CctvCoverage.Core.dll
            src/CctvCoverage.Revit/bin/Release/net8.0-windows/CctvCoverage.addin
            src/CctvCoverage.Revit/bin/Release/net8.0-windows/CctvSharedParameters.txt
